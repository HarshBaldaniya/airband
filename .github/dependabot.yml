# Dependabot keeps the dependencies current: one pull request a month per kind, with the small
# updates grouped, so the list stays short. Security fixes come at once, whatever this says.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/site", "/relay", "/desktop"]
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # Kept at the oldest VS Code the extension supports (engines.vscode): vsce refuses to package
      # an extension whose types are newer. Moved by hand, together with engines.vscode.
      - dependency-name: "@types/vscode"
      # Kept at the oldest Node.js Airband supports, so nothing newer is used by mistake.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A new major changes the board's API (13 removed useStore): moved by hand with that code.
      - dependency-name: "@xyflow/react"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
