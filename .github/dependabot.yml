# Dependabot keeps the dependencies current: one pull request a month per kind, with the small
# updates grouped, so the list stays short. Security fixes come at once, whatever this says.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/site", "/relay", "/desktop"]
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
