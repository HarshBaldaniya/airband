# The small desktop app (Tauri, on the system's own web view): a .dmg for macOS and an .exe
# installer for Windows, each a few MB. Built on every v* tag (and attached to its GitHub release),
# on demand, and when its code changes on main.
name: Desktop app (small)

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Paths don't apply to tags: every v* tag builds, and its release gets the files.
    tags: ["v*"]
    paths:
      - "desktop-lite/**"
      - "desktop/ui/**"
      - ".github/workflows/desktop-lite.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: tauri build --bundles app,dmg --target aarch64-apple-darwin && npx tauri build --bundles app,dmg --target x86_64-apple-darwin
          - os: windows-latest
            build: tauri build --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-lite/src-tauri
      - run: npm ci
      # The setup tour's screens, then the app.
      - run: npx esbuild desktop-lite/ui-src/setup.tsx --bundle --minify --format=iife --jsx=automatic --target=es2020 --loader:.svg=text --define:process.env.NODE_ENV='"production"' --outfile=desktop-lite/ui/setup.js
      - run: npm ci
        working-directory: desktop-lite
      - run: npx ${{ matrix.build }}
        working-directory: desktop-lite
      # The names people expect: Airband-<version>.dmg, Airband-Setup-<version>.exe.
      - run: node scripts/name-lite.mjs
      # The size, so a release never grows past the target without anyone seeing it.
      - name: Size
        shell: bash
        run: |
          for f in desktop-lite/release/*; do
            size=$(wc -c < "$f"); echo "$(basename "$f")  $((size / 1024)) KB"; if [ "$size" -gt 5242880 ]; then echo "::error::$f is over 5 MB"; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: airband-small-${{ matrix.os }}
          path: desktop-lite/release/*
          if-no-files-found: error
      # A tag's release gets the files, made from the CHANGELOG's notes when it doesn't exist yet.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            v="${TAG#v}"
            awk -v h="## $v" '$0==h{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
            gh release create "$TAG" --title "$TAG" --notes-file notes.md || true
          fi
          gh release upload "$TAG" desktop-lite/release/* --clobber
