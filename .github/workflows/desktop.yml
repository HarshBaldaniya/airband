# The desktop app (Tauri, on the system's own web view): a .dmg for macOS and an .exe
# installer for Windows, each a few MB. Built on every v* tag (and attached to its GitHub release),
# on demand, and when its code changes on main.
name: Desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Paths don't apply to tags: every v* tag builds, and its release gets the files.
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "companion/**"
      - "scripts/name-downloads.mjs"
      - "scripts/release-names.mjs"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
            targets: aarch64-apple-darwin x86_64-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            bundles: nsis
            targets: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      # The setup tour's screens, then the app.
      - run: npm run app:tour
      - run: npm ci
        working-directory: desktop
      # Signed for updates with the key in the repository's secrets (its public half is in
      # tauri.conf.json): an installed app takes only files signed with it. One build per target.
      - name: Build
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUNDLES: ${{ matrix.bundles }}
          TARGETS: ${{ matrix.targets }}
        run: |
          if [ -z "$TARGETS" ]; then
            npx tauri build --bundles "$BUNDLES"
          else
            for target in $TARGETS; do npx tauri build --bundles "$BUNDLES" --target "$target"; done
          fi
      # The names people expect: Airband-<version>.dmg, Airband-Setup-<version>.exe.
      - run: node scripts/name-downloads.mjs
      # The size, so a release never grows past the target without anyone seeing it.
      - name: Size
        shell: bash
        run: |
          for f in desktop/release/*; do
            size=$(wc -c < "$f"); echo "$(basename "$f")  $((size / 1024)) KB"; if [ "$size" -gt 5242880 ]; then echo "::error::$f is over 5 MB"; exit 1; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airband-small-${{ matrix.os }}
          path: desktop/release/*
          if-no-files-found: error
      # A tag's release gets the files, made from the CHANGELOG's notes when it doesn't exist yet.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            v="${TAG#v}"
            awk -v h="## $v" '$0==h{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
            gh release create "$TAG" --title "$TAG" --notes-file notes.md || true
          fi
          gh release upload "$TAG" desktop/release/* --clobber

  # The engine's signature: installed apps take an engine from npm only when the release of its
  # version has airband-engine-<version>.tgz.sig, made with the updater's key from the tarball npm
  # serves (scripts/sign-engine.mjs). The version must be on npm before the tag is pushed.
  engine:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: desktop
      - name: Sign the engine npm serves for this version
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: node scripts/sign-engine.mjs "${TAG#v}"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            v="${TAG#v}"
            awk -v h="## $v" '$0==h{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
            gh release create "$TAG" --title "$TAG" --notes-file notes.md || true
          fi
          gh release upload "$TAG" desktop/release/airband-engine-*.tgz.sig --clobber

  # Once every computer's files and the engine's signature are on the release: latest.json, which
  # installed apps read to find a newer version. "releases/latest" always points at the newest
  # release's copy, so an app is offered a version only once that version's engine can be checked.
  updater:
    needs: [build, engine]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: desktop/release
          merge-multiple: true
      - run: node scripts/updater-manifest.mjs
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" desktop/release/latest.json --clobber
