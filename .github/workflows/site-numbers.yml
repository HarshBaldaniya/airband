# The website's npm count, fresh every day. The site reads it from npm when it is built
# (site/lib/stats.ts), never from a visitor's browser, and npm counts a day once it is over: one
# build every morning keeps the number as current as npm has it. A build that could not read the
# count is not deployed, so the live site never loses the number.
name: Website numbers

on:
  schedule:
    # 03:30 UTC, 9:00 AM in India: npm has counted yesterday by then.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-numbers
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'HarshBaldaniya/airband'
    runs-on: ubuntu-latest
    env:
      # The Vercel project "airband"; the token is a secret made at vercel.com/account/tokens.
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Read by site/lib/release.ts, so GitHub's hourly allowance never drops the download sizes.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Vercel is set up for this repository
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Needs the VERCEL_TOKEN secret and the VERCEL_ORG_ID and VERCEL_PROJECT_ID variables."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npx -y vercel@66.6.0 pull --yes --environment=production --token "$VERCEL_TOKEN"
      - run: npx -y vercel@66.6.0 build --prod --token "$VERCEL_TOKEN"
      - name: The count is on the page
        run: |
          page=.vercel/output/static/index.html
          if ! grep -q "npm downloads" "$page"; then
            echo "::error::npm's count could not be read. The live site was left as it is."
            exit 1
          fi
      - run: npx -y vercel@66.6.0 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
