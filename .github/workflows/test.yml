# Runs every test on macOS, Windows and Linux, so nothing works on one computer only.
name: Tests
on: [push, pull_request]
# Read-only: the tests need nothing else.
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The desktop app's commands: a command missing from one of the four places it is named is
      # refused by the app with nothing on screen.
      - run: node scripts/check-commands.mjs
      # One version in every file that keeps a copy, and one set of download names.
      - run: node scripts/check-release.mjs
      # The one-line installs: a mistake in either breaks every new install on that system.
      - name: The install scripts read
        if: runner.os != 'Linux'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/site/public/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
          if ($IsMacOS) { sh -n site/public/install.sh; if ($LASTEXITCODE) { exit 1 } }
      - name: The install script reads in Windows PowerShell 5
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\site\public\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
