name: Something doesn't work
description: Airband, Roger or an agent's setup does something it shouldn't.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: "1. …\n2. …\n3. …"
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: What `airband doctor` says
      description: Run `airband doctor` and paste what it prints. It contains no chats or keys.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Airband 0.2.1, macOS 15, Claude Code 2.1, Codex 0.167"
    validations: { required: true }
